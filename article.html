<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("ap-theme")||"light")</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AmericaPulse.live</title>
  <meta name="theme-color" content="#0B1F3A" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="canonical" id="canonical-url" href="https://americapulse.live/article.html" />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="AmericaPulse.live" />
  <meta id="og-title" property="og:title" content="AmericaPulse.live" />
  <meta id="og-desc" property="og:description" content="" />
  <meta id="og-image" property="og:image" content="" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@AmericaPulse" />
  <meta id="twitter-title" name="twitter:title" content="" />
  <meta id="twitter-desc" name="twitter:description" content="" />
  <meta id="twitter-image" name="twitter:image" content="" />
  <meta id="article-published" property="article:published_time" content="" />
  <meta id="article-author" property="article:author" content="" />
  <meta id="article-section" property="article:section" content="" />
  <link rel="dns-prefetch" href="https://picsum.photos" />
  <link rel="dns-prefetch" href="https://api.open-meteo.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles-all.min.css" />
  <link rel="search" type="application/opensearchdescription+xml" title="AmericaPulse.live" href="/opensearch.xml" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="alternate" type="application/rss+xml" title="AmericaPulse.live" href="/feed.xml" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@400;500;600;700&display=swap" /></noscript>
</head>
<body>
  <div id="site-header"></div>
  <main class="main-content" id="main-content" role="main">
    <div class="container">
      <div class="article-layout">
        <div id="article-content" class="article-main">
          <div class="article-loading">Loading article…</div>
        </div>
        <aside class="sidebar" id="sidebar-area"></aside>
      </div>
      <div id="related-articles" style="margin-top:48px"></div>
    </div>
  </main>
  <div id="site-footer"></div>

  <!-- Meta DB (150 KB) for slug→section lookup; body loaded per-section below -->
  <script src="data/articles-meta.js"></script>
  <script src="js/images.js"></script>
  <script src="js/app.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/sidebar.js" defer></script>
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    var slug = new URLSearchParams(window.location.search).get('slug') || '';
    var meta = typeof ARTICLES_META !== 'undefined' ? ARTICLES_META : [];
    var metaEntry = meta.find(function(a) { return a.slug === slug; });

    if (!metaEntry) {
      // AI-generated or unknown article — renderArticlePage will fetch from function
      renderArticlePage();
      return;
    }

    // Load only the one section file needed (~100 KB vs 811 KB)
    var s = document.createElement('script');
    s.src = 'data/articles-' + metaEntry.section + '.js';
    s.onload = function() { renderArticlePage(); };
    s.onerror = function() { renderArticlePage(); };
    document.head.appendChild(s);
  });
  </script>
</body>
</html>
