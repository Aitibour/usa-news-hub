[build]
  publish = "."
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Security headers ──
[[headers]]
  for = "/*"
  [headers.values]
    # Clickjacking prevention
    X-Frame-Options = "DENY"
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    # Reflected XSS filter (legacy browsers)
    X-XSS-Protection = "1; mode=block"
    # Limit referrer info sent to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disable unused browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # Force HTTPS for 1 year, include subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy
    # - script-src: only self + inline (site uses inline scripts extensively)
    # - style-src: self + inline + Google Fonts CSS
    # - font-src: Google Fonts static files only
    # - img-src: self + picsum (placeholder images) + data URIs
    # - connect-src: self (Netlify functions) + weather API
    # - frame-ancestors: no embedding anywhere
    # - form-action: forms only submit to self
    # - base-uri: prevent base tag hijacking
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://picsum.photos https://fastly.picsum.photos data: blob:; connect-src 'self' https://api.open-meteo.com; media-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self';"
    # Prevent cross-origin data leaks
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Long-cache for versioned/static assets
[[headers]]
  for = "/data/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"

[[redirects]]
  from = "/api/articles"
  to   = "/.netlify/functions/get-articles"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to   = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/feed.xml"
  to   = "/.netlify/functions/feed"
  status = 200
